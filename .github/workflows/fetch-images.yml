# Temporary: downloads the Framer CDN images into the repo and commits them
# back to this branch. Removed again once the images are in.
name: Fetch images from Framer CDN

on:
  push:
    branches: [claude/fervent-ride-jprn2g]
    paths: [scripts/fetch-images.mjs, .github/workflows/fetch-images.yml]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fetch-images.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/assets/images
          git commit -m "Add images downloaded from Framer CDN"
          git push
