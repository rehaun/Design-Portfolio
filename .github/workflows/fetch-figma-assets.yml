# Temporary: downloads exported Figma assets and commits them back to this branch.
name: Fetch Figma assets

on:
  push:
    branches: [claude/fervent-ride-jprn2g]
    paths: [scripts/fetch-figma-assets.sh, .github/workflows/fetch-figma-assets.yml]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/fetch-figma-assets.sh
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/assets/brand
          git commit -m "Add avatar exported from Figma"
          git push
