# Temporary: snapshots the live Framer site and commits the result to this branch.
name: Snapshot Framer site

on:
  push:
    branches: [claude/fervent-ride-jprn2g]
    paths: [scripts/snapshot-framer.mjs, .github/workflows/snapshot-framer.yml]

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i --no-save playwright@1 && npx playwright install --with-deps chromium
      - run: node scripts/snapshot-framer.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add framer-snapshot
          git commit -m "Add Framer site snapshot (temporary)"
          git push
